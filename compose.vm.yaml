# Compose untuk VM staging Kyrion (sec-0.3). compose.yaml di root tetap konfigurasi pengembangan.
# Jalankan: sudo docker compose --env-file /srv/kyrion/env/kyrion.env -f compose.vm.yaml up -d
name: kyrion-vm

services:
  db:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER wajib diisi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB wajib diisi}
    volumes:
      - kyrion-pgdata:/var/lib/postgresql
    networks:
      - backend
    cap_drop:
      - ALL
    # Capability yang dijustifikasi: entrypoint PostgreSQL mengatur kepemilikan folder data lalu turun hak ke pengguna postgres.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Tanpa "ports": basis data tidak dipublikasikan ke host.

  app:
    image: kyrion-web:hardened
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL wajib diisi}
      KYRION_STORAGE_DIR: ${KYRION_STORAGE_DIR:?KYRION_STORAGE_DIR wajib diisi}
      KYRION_MASTER_KEY_FILE: ${KYRION_MASTER_KEY_FILE:?KYRION_MASTER_KEY_FILE wajib diisi}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET wajib diisi}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL wajib diisi}
      EMAIL_ADAPTER: ${EMAIL_ADAPTER:?EMAIL_ADAPTER wajib diisi}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM wajib diisi}
      MAILTRAP_API_TOKEN: ${MAILTRAP_API_TOKEN:?MAILTRAP_API_TOKEN wajib diisi}
      MAILTRAP_SANDBOX_ID: ${MAILTRAP_SANDBOX_ID:?MAILTRAP_SANDBOX_ID wajib diisi}
      KYRION_SIGNING_KEY_FILE: ${KYRION_SIGNING_KEY_FILE:?KYRION_SIGNING_KEY_FILE wajib diisi}
      KYRION_KEYRING_FILE: ${KYRION_KEYRING_FILE:?KYRION_KEYRING_FILE wajib diisi}
    secrets:
      - kyrion_master_key
    volumes:
      - kyrion-storage:/app/storage
      # Folder (bukan berkas) agar rename atomik keyring terlihat; app hanya membaca.
      - /srv/kyrion/keys:/keys:ro
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/masuk || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    # nginx 1.30.6 (stable-alpine), ditarik 2026-11-22; dikunci lewat digest agar scan dan runtime sama.
    image: nginxinc/nginx-unprivileged@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Satu-satunya layanan yang dipublikasikan ke luar VM (R-09..R-15); app dan db tidak punya "ports".
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./deploy/nginx/kyrion.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/kyrion/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - /srv/kyrion/tls/server.key:/etc/nginx/tls/server.key:ro
    networks:
      - frontend
    depends_on:
      app:
        condition: service_healthy

  tools:
    image: kyrion-web:tools
    profiles: ["tools"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL wajib diisi}
      KYRION_KEYRING_FILE: ${KYRION_KEYRING_FILE:?KYRION_KEYRING_FILE wajib diisi}
    env_file:
      - /srv/kyrion/env/seed.env
    volumes:
      - /srv/kyrion/keys:/keys
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

secrets:
  kyrion_master_key:
    file: /srv/kyrion/secrets/kyrion_master_key

volumes:
  kyrion-pgdata:
  kyrion-storage:

networks:
  backend:
    internal: true
  frontend: {}
