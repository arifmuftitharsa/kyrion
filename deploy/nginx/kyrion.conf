# Nginx TLS reverse proxy untuk Kyrion (staging). Berjalan sebagai nginx-unprivileged:
# port di dalam container 8080 dan 8443, dipetakan ke 80 dan 443 oleh compose.
# Risiko terkait: R-09..R-15 (jaringan/TLS), T-11..T-13 (rate limit login) di risk-register.md.

# Sembunyikan versi Nginx di semua server block (konteks http).
server_tokens off;

limit_req_zone $binary_remote_addr zone=kyrion_umum:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=kyrion_otp:10m rate=10r/m;
limit_req_status 429;

# Host lain selain kyrion.test ditolak sebelum sertifikat dikirim.
server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 8080 default_server;
    return 301 https://kyrion.test$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name kyrion.test;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS sengaja pendek (5 menit): tanpa includeSubDomains dan preload.
    add_header Strict-Transport-Security "max-age=300" always;

    # Batas unggah PDF 10 MB ditambah selisih untuk form multipart.
    client_max_body_size 11m;

    # Pengaturan proxy di tingkat server: diwarisi semua location di bawah.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Timpa, bukan tambahkan: klien tidak boleh memalsukan IP sumber.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Kirim dan verifikasi OTP: batas ketat per IP, lapisan di depan rateLimit Better Auth.
    location ~ ^/api/auth/(email-otp/send-verification-otp|sign-in/email-otp)$ {
        limit_req zone=kyrion_otp burst=5 nodelay;
        proxy_pass http://app:3000;
    }

    location / {
        limit_req zone=kyrion_umum burst=40 nodelay;
        proxy_pass http://app:3000;
    }
}