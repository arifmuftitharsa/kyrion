openapi: 3.1.0
info:
  title: Kyrion API
  version: 0.3.0
  description: |
    API Kyrion untuk membaca regulasi beserta versinya, mengesahkan versi (Admin),
    dan mengelola sesi milik sendiri.

    **Autentikasi** memakai cookie sesi (lihat skema `cookieSesi`), bukan token
    bearer. Tanpa sesi, endpoint menjawab 401.

    **Pemeriksaan Origin.** Permintaan `POST` dan `DELETE` wajib membawa header
    `Origin` yang sama persis dengan origin aplikasi; tanpa header itu, atau bila
    berbeda, jawabannya 403. Pemeriksaan ini dilakukan sebelum pemeriksaan sesi,
    sehingga permintaan anonim dengan Origin salah pun dijawab 403, bukan 401.

    **Metode yang tidak didukung** (misalnya `POST /api/v1/sessions`) dijawab 405
    bawaan Next.js, tanpa `application/problem+json`.

    Semua respons memakai `Cache-Control: no-store`. Respons sukses berupa
    `application/json` dengan pembungkus `{ "data": ... }`; respons galat berupa
    `application/problem+json` (RFC 9457).

    **Versi yang berlaku** pada suatu tanggal acuan dipilih dari versi berstatus
    `SAH` atau `DIGANTIKAN` yang `effectiveDate`-nya sama dengan atau sebelum tanggal
    acuan, lalu diambil yang `effectiveDate`-nya paling akhir. Versi `DRAF` dan
    `DIBATALKAN` tidak pernah keluar dari API ini. Bila ada dua versi dengan
    `effectiveDate` sama, yang lebih dulu dalam urutan data (dibuat paling akhir)
    dipakai; aturan penentu seri ini masih sementara. Bila tidak ada versi yang
    memenuhi, `currentVersion` bernilai `null`. Tanggal acuan bawaan adalah hari ini
    menurut zona waktu Asia/Jakarta (WIB).

    Seluruh contoh pada dokumen ini adalah data rekaan (sintetis).
servers:
  - url: http://localhost:3000/api/v1
    description: Pengembangan lokal
security:
  - cookieSesi: []
tags:
  - name: Regulasi
    description: Pembacaan regulasi dan versinya.
  - name: Pengesahan
    description: Pengesahan versi regulasi (khusus Admin).
  - name: Sesi
    description: Sesi aktif milik pengguna yang sedang masuk.
paths:
  /regulations:
    get:
      tags: [Regulasi]
      operationId: daftarRegulasi
      summary: Daftar regulasi beserta versi yang berlaku hari ini
      description: |
        Mengembalikan regulasi terurut menurut nama (menaik). Daftar versi lengkap
        tidak ikut; hanya `currentVersion` pada hari ini (WIB). Kategori yang tidak
        dikenal menghasilkan `data: []`, bukan 404. Parameter query yang tidak dikenal
        atau diulang ditolak dengan 400.
      parameters:
        - $ref: "#/components/parameters/KategoriQuery"
      responses:
        "200":
          $ref: "#/components/responses/DaftarRegulasi200"
        "400":
          $ref: "#/components/responses/Galat400"
        "401":
          $ref: "#/components/responses/Galat401"
        "500":
          $ref: "#/components/responses/Galat500"
  /regulations/{slug}:
    get:
      tags: [Regulasi]
      operationId: detailRegulasi
      summary: Detail satu regulasi beserta linimasa versinya
      description: |
        Linimasa `versions` diurutkan dari `effectiveDate` terbaru. `currentVersion`
        dihitung untuk hari ini (WIB). Slug berformat salah diperlakukan sama dengan
        slug yang tidak ada (404) dan diperiksa sebelum query. Endpoint ini tidak
        menerima parameter query: kunci apa pun ditolak dengan 400.
      parameters:
        - $ref: "#/components/parameters/SlugRegulasi"
      responses:
        "200":
          $ref: "#/components/responses/DetailRegulasi200"
        "400":
          $ref: "#/components/responses/Galat400"
        "401":
          $ref: "#/components/responses/Galat401"
        "404":
          $ref: "#/components/responses/Galat404"
        "500":
          $ref: "#/components/responses/Galat500"
  /regulations/{slug}/current-version:
    get:
      tags: [Regulasi]
      operationId: versiBerlakuPadaTanggal
      summary: Versi regulasi yang berlaku pada tanggal acuan
      description: |
        Slug berformat salah atau tidak ada menghasilkan 404, dan diutamakan atas
        validasi query. `date` yang tidak sah, diulang, atau parameter lain yang tidak
        dikenal menghasilkan 400. Field `date` pada respons adalah tanggal acuan yang
        benar-benar dipakai (hari ini WIB bila `date` tidak dikirim).
      parameters:
        - $ref: "#/components/parameters/SlugRegulasi"
        - $ref: "#/components/parameters/TanggalAcuanQuery"
      responses:
        "200":
          $ref: "#/components/responses/VersiBerlaku200"
        "400":
          $ref: "#/components/responses/Galat400"
        "401":
          $ref: "#/components/responses/Galat401"
        "404":
          $ref: "#/components/responses/Galat404"
        "500":
          $ref: "#/components/responses/Galat500"
  /regulations/{slug}/versions/{versionId}/approval:
    post:
      tags: [Pengesahan]
      operationId: sahkanVersi
      summary: Mengesahkan versi berstatus Draf (khusus Admin)
      description: |
        Hanya peran Admin. Permintaan tidak memiliki badan; tidak ada penguncian
        optimistik dari klien. Pengaman utamanya adalah status `DRAF` yang diperiksa
        ulang di dalam transaksi. `Origin` wajib sama dengan origin aplikasi (403 bila
        tidak). Slug atau `versionId` berformat salah, regulasi yang tidak ada, dan
        versi yang bukan milik regulasi itu sama-sama menghasilkan 404.
      parameters:
        - $ref: "#/components/parameters/SlugRegulasi"
        - $ref: "#/components/parameters/IdVersi"
      responses:
        "200":
          $ref: "#/components/responses/Pengesahan200"
        "401":
          $ref: "#/components/responses/Galat401"
        "403":
          $ref: "#/components/responses/Galat403"
        "404":
          $ref: "#/components/responses/Galat404"
        "409":
          $ref: "#/components/responses/Galat409"
        "500":
          $ref: "#/components/responses/Galat500"
  /sessions:
    get:
      tags: [Sesi]
      operationId: daftarSesi
      summary: Daftar sesi aktif milik pengguna yang sedang masuk
      description: |
        Hanya sesi milik sendiri yang belum kedaluwarsa. Respons tidak memuat token,
        alamat IP, maupun user agent. `current` bernilai `true` untuk sesi yang
        dipakai permintaan ini. Metode selain GET dijawab 405 bawaan Next.js.
      responses:
        "200":
          $ref: "#/components/responses/DaftarSesi200"
        "401":
          $ref: "#/components/responses/Galat401"
        "500":
          $ref: "#/components/responses/Galat500"
  /sessions/{id}:
    delete:
      tags: [Sesi]
      operationId: cabutSesi
      summary: Mencabut satu sesi milik sendiri
      description: |
        Boleh mencabut sesi yang sedang dipakai (sama dengan keluar). `id` yang bukan
        UUID, sesi yang tidak ada, dan sesi milik pengguna lain sengaja tidak
        dibedakan: semuanya 404. `Origin` wajib sama dengan origin aplikasi (403 bila
        tidak).
      parameters:
        - $ref: "#/components/parameters/IdSesi"
      responses:
        "204":
          $ref: "#/components/responses/Tanpa204"
        "401":
          $ref: "#/components/responses/Galat401"
        "403":
          $ref: "#/components/responses/Galat403"
        "404":
          $ref: "#/components/responses/Galat404"
        "500":
          $ref: "#/components/responses/Galat500"
components:
  securitySchemes:
    cookieSesi:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: |
        Cookie sesi Better Auth (`httpOnly`, `SameSite=Lax`). Di HTTPS (bila
        `BETTER_AUTH_URL` berawalan `https://`) namanya memakai awalan `__Secure-`,
        yaitu `__Secure-better-auth.session_token`.
  parameters:
    SlugRegulasi:
      name: slug
      in: path
      required: true
      description: Slug regulasi.
      schema:
        $ref: "#/components/schemas/Slug"
    KategoriQuery:
      name: category
      in: query
      required: false
      description: Slug kategori untuk menyaring daftar. Tanpa nilai ini, semua regulasi dikembalikan.
      schema:
        $ref: "#/components/schemas/Slug"
    IdVersi:
      name: versionId
      in: path
      required: true
      description: ID versi (UUID).
      schema:
        type: string
        format: uuid
    IdSesi:
      name: id
      in: path
      required: true
      description: ID sesi (UUID).
      schema:
        type: string
        format: uuid
    TanggalAcuanQuery:
      name: date
      in: query
      required: false
      description: Tanggal acuan (YYYY-MM-DD, tanggal kalender yang sah). Bawaan hari ini menurut WIB.
      schema:
        $ref: "#/components/schemas/TanggalIso"
  headers:
    CacheControl:
      description: Selalu `no-store`.
      schema:
        type: string
        const: no-store
  schemas:
    Slug:
      type: string
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      examples: [regulasi-contoh]
    TanggalIso:
      type: string
      format: date
      examples: ["2026-01-01"]
    StatusVersi:
      type: string
      description: |
        Hanya versi yang pernah disahkan yang muncul di respons baca. `DRAF` dan
        `DIBATALKAN` ada pada enum basis data tetapi disaring di lapisan data.
      enum: [SAH, DIGANTIKAN]
    VersiBerlaku:
      type: object
      required: [id, versionNumber, effectiveDate, status]
      properties:
        id:
          type: string
          format: uuid
        versionNumber:
          type: string
        effectiveDate:
          $ref: "#/components/schemas/TanggalIso"
        status:
          $ref: "#/components/schemas/StatusVersi"
    VersiLinimasa:
      allOf:
        - $ref: "#/components/schemas/VersiBerlaku"
        - type: object
          required: [fileSize]
          properties:
            fileSize:
              type: [integer, "null"]
              description: Ukuran berkas PDF dalam byte; `null` bila versi belum punya berkas.
    RingkasanRegulasi:
      type: object
      required: [slug, name, category, description, currentVersion]
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        name:
          type: string
        category:
          type: string
          description: Nama kategori (bukan slug).
        description:
          type: [string, "null"]
        currentVersion:
          description: Versi yang berlaku hari ini (WIB); `null` bila belum ada.
          oneOf:
            - $ref: "#/components/schemas/VersiBerlaku"
            - type: "null"
    DetailRegulasi:
      allOf:
        - $ref: "#/components/schemas/RingkasanRegulasi"
        - type: object
          required: [versions]
          properties:
            versions:
              type: array
              description: Dari `effectiveDate` terbaru.
              items:
                $ref: "#/components/schemas/VersiLinimasa"
    VersiBerlakuPadaTanggal:
      type: object
      required: [slug, date, currentVersion]
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        date:
          $ref: "#/components/schemas/TanggalIso"
        currentVersion:
          description: Versi yang berlaku pada `date`; `null` bila belum ada.
          oneOf:
            - $ref: "#/components/schemas/VersiBerlaku"
            - type: "null"
    DaftarRegulasiResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RingkasanRegulasi"
    DetailRegulasiResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/DetailRegulasi"
    VersiBerlakuResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/VersiBerlakuPadaTanggal"
    PengesahanResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, status]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              const: SAH
    SesiRingkas:
      type: object
      description: Hanya id dan waktu; tanpa token, IP, atau user agent.
      required: [id, createdAt, expiresAt, current]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: "`true` untuk sesi yang dipakai permintaan ini."
    DaftarSesiResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SesiRingkas"
    GalatField:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Nama parameter query; `query` bila galat tidak terkait satu parameter.
        message:
          type: string
    Masalah:
      type: object
      description: Detail masalah menurut RFC 9457.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri-reference
          description: Berbentuk `/problems/<jenis>`.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: Path permintaan, tanpa query string.
    MasalahValidasi:
      allOf:
        - $ref: "#/components/schemas/Masalah"
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                $ref: "#/components/schemas/GalatField"
  responses:
    DaftarRegulasi200:
      description: Daftar regulasi (contoh sintetis).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DaftarRegulasiResponse"
          example:
            data:
              - slug: regulasi-contoh-satu
                name: Regulasi Contoh Satu (sintetis)
                category: Kategori Contoh
                description: Deskripsi rekaan.
                currentVersion:
                  id: 00000000-0000-7000-8000-000000000001
                  versionNumber: "1.0"
                  effectiveDate: "2026-01-01"
                  status: SAH
              - slug: regulasi-contoh-dua
                name: Regulasi Contoh Dua (sintetis)
                category: Kategori Contoh
                description: null
                currentVersion: null
    DetailRegulasi200:
      description: Detail regulasi (contoh sintetis).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DetailRegulasiResponse"
          example:
            data:
              slug: regulasi-contoh-satu
              name: Regulasi Contoh Satu (sintetis)
              category: Kategori Contoh
              description: Deskripsi rekaan.
              currentVersion:
                id: 00000000-0000-7000-8000-000000000002
                versionNumber: "2.0"
                effectiveDate: "2026-06-01"
                status: SAH
              versions:
                - id: 00000000-0000-7000-8000-000000000002
                  versionNumber: "2.0"
                  effectiveDate: "2026-06-01"
                  status: SAH
                  fileSize: 123456
                - id: 00000000-0000-7000-8000-000000000001
                  versionNumber: "1.0"
                  effectiveDate: "2026-01-01"
                  status: DIGANTIKAN
                  fileSize: null
    VersiBerlaku200:
      description: Versi yang berlaku pada tanggal acuan (contoh sintetis).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VersiBerlakuResponse"
          example:
            data:
              slug: regulasi-contoh-satu
              date: "2026-03-15"
              currentVersion:
                id: 00000000-0000-7000-8000-000000000001
                versionNumber: "1.0"
                effectiveDate: "2026-01-01"
                status: DIGANTIKAN
    Pengesahan200:
      description: Versi berhasil disahkan (contoh sintetis).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PengesahanResponse"
          example:
            data:
              id: 00000000-0000-7000-8000-000000000003
              status: SAH
    DaftarSesi200:
      description: Sesi aktif milik sendiri (contoh sintetis).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DaftarSesiResponse"
          example:
            data:
              - id: 00000000-0000-7000-8000-0000000000a1
                createdAt: "2026-11-14T01:00:00.000Z"
                expiresAt: "2026-11-21T01:00:00.000Z"
                current: true
              - id: 00000000-0000-7000-8000-0000000000a2
                createdAt: "2026-11-10T08:30:00.000Z"
                expiresAt: "2026-11-17T08:30:00.000Z"
                current: false
    Tanpa204:
      description: Berhasil, tanpa badan respons.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
    Galat401:
      description: Belum masuk (tidak ada sesi yang sah).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Masalah"
          example:
            type: /problems/unauthenticated
            title: Belum masuk
            status: 401
            detail: Perlu masuk.
            instance: /api/v1/sessions
    Galat403:
      description: |
        Ditolak. Dua sebab pada dokumen ini: peran bukan Admin (endpoint pengesahan),
        atau header `Origin` tidak sama dengan origin aplikasi (`POST` dan `DELETE`).
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Masalah"
          examples:
            peran:
              summary: Peran bukan Admin
              value:
                type: /problems/forbidden
                title: Tidak berwenang
                status: 403
                detail: Tidak diizinkan.
                instance: /api/v1/regulations/regulasi-contoh-satu/versions/00000000-0000-7000-8000-000000000003/approval
            origin:
              summary: Origin tidak diizinkan
              value:
                type: /problems/forbidden
                title: Tidak berwenang
                status: 403
                detail: Origin tidak diizinkan.
                instance: /api/v1/sessions/00000000-0000-7000-8000-0000000000a2
    Galat409:
      description: |
        Versi tidak dapat disahkan pada keadaannya sekarang (`state-conflict`). Tiga
        kemungkinan pesan `detail`, semuanya tetap.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Masalah"
          examples:
            bukanDraf:
              summary: Versi bukan Draf atau sudah berubah
              value:
                type: /problems/state-conflict
                title: Keadaan tidak mengizinkan
                status: 409
                detail: Versi bukan Draf atau sudah berubah.
                instance: /api/v1/regulations/regulasi-contoh-satu/versions/00000000-0000-7000-8000-000000000003/approval
            tanpaBerkas:
              summary: Versi belum punya berkas PDF lengkap
              value:
                type: /problems/state-conflict
                title: Keadaan tidak mengizinkan
                status: 409
                detail: Versi belum punya berkas PDF lengkap. Unggah berkas lewat Ubah sebelum mengesahkan.
                instance: /api/v1/regulations/regulasi-contoh-satu/versions/00000000-0000-7000-8000-000000000003/approval
            tanggalKembar:
              summary: Tanggal berlaku sudah dipakai versi sah lain
              value:
                type: /problems/state-conflict
                title: Keadaan tidak mengizinkan
                status: 409
                detail: Sudah ada versi lain yang disahkan dengan tanggal berlaku yang sama. Ubah tanggal berlaku versi ini.
                instance: /api/v1/regulations/regulasi-contoh-satu/versions/00000000-0000-7000-8000-000000000003/approval
    Galat400:
      description: Parameter query tidak valid, tidak dikenal, atau diulang.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/MasalahValidasi"
          example:
            type: /problems/validation-error
            title: Masukan tidak valid
            status: 400
            detail: Parameter query tidak valid.
            instance: /api/v1/regulations/regulasi-contoh-satu/current-version
            errors:
              - field: date
                message: Tanggal harus berformat YYYY-MM-DD yang sah
    Galat404:
      description: |
        Sumber daya tidak ditemukan. Untuk regulasi dan versi, termasuk slug atau ID
        berformat salah. Untuk sesi, `id` bukan UUID, sesi tidak ada, dan sesi milik
        pengguna lain sengaja tidak dibedakan.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Masalah"
          examples:
            regulasi:
              summary: Regulasi tidak ditemukan
              value:
                type: /problems/not-found
                title: Tidak ditemukan
                status: 404
                detail: Regulasi tidak ditemukan.
                instance: /api/v1/regulations/regulasi-tidak-ada
            versi:
              summary: Versi tidak ditemukan
              value:
                type: /problems/not-found
                title: Tidak ditemukan
                status: 404
                detail: Versi tidak ditemukan.
                instance: /api/v1/regulations/regulasi-contoh-satu/versions/00000000-0000-7000-8000-000000000009/approval
            sesi:
              summary: Sesi tidak ditemukan
              value:
                type: /problems/not-found
                title: Tidak ditemukan
                status: 404
                detail: Sesi tidak ditemukan.
                instance: /api/v1/sessions/00000000-0000-7000-8000-000000000009
    Galat500:
      description: Galat server. Pesan galat asli tidak pernah dikirim.
      headers:
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Masalah"
          example:
            type: /problems/internal-error
            title: Galat server
            status: 500
            detail: Terjadi kesalahan pada server.
            instance: /api/v1/regulations
