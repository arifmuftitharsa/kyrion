# Log terpusat Kyrion: Alloy -> Loki -> Grafana (sec-0.3 Bagian B; R-15, T-21, T-25, T-22).
# Terpisah dari compose.vm.yaml. Jalankan dari /srv/kyrion/monitoring di VM:
#   sudo docker compose -p kyrion-mon --env-file images.env -f compose.monitoring.yaml up -d
# (overlay journald untuk app dan nginx dipasang terpisah ke compose.vm.yaml; lihat README.md)
# Image dikunci digest lewat images.env (dibuat 06-monitoring-vm.sh siapkan). Tanpa docker.sock.
name: kyrion-mon

services:
  loki:
    image: ${LOKI_IMAGE:?LOKI_IMAGE belum diisi (jalankan fase siapkan)}
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    volumes:
      - ./loki-config.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - logs
    # Tanpa "ports": Loki tidak terbuka ke host (auth_enabled false, jadi hanya jaringan internal).
    # Tanpa healthcheck: image grafana/loki tidak punya shell, wget, atau curl (CMD-SHELL gagal dengan
    # "/bin/sh: no such file"), dan tidak ada bentuk exec yang terbukti jalan. Kesiapan diperiksa dari luar oleh
    # deploy/uji/06-monitoring-vm.sh (fase jalankan) lewat container sementara di jaringan logs.

  alloy:
    image: ${ALLOY_IMAGE:?ALLOY_IMAGE belum diisi}
    restart: unless-stopped
    # root di container hanya agar dapat membaca journal host; semua kapabilitas dilepas, rootfs read-only.
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/alloy-state
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      # Jalur dan volume baru (bukan /var/lib/alloy/data): jalur itu ada di image dan volume bernama menyalin pemilik dan
      # mode-nya; root tanpa CAP_DAC_OVERRIDE (cap_drop ALL) lalu tidak dapat mkdir di sana. /alloy-state tidak ada di
      # image, jadi volume baru dimulai root:root 0755 dan root menjadi pemilik. Volume lama alloy-data tidak dipakai lagi.
      - alloy-state:/alloy-state
      # Aset dan risiko baru: akses baca ke seluruh journal host (usulan R-16 di README.md). Bukan docker.sock.
      - type: bind
        source: /var/log/journal
        target: /var/log/journal
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/log/journal
        target: /run/log/journal
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/machine-id
        target: /etc/machine-id
        read_only: true
    networks:
      - logs
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: ${GRAFANA_IMAGE:?GRAFANA_IMAGE belum diisi}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    environment:
      GF_SECURITY_ADMIN_USER: kyrion-admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - logs
      - akses
    # Hanya loopback VM; diakses dari laptop lewat SSH tunnel: ssh -L 3001:127.0.0.1:3001 kyrion-staging
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      loki:
        condition: service_started

secrets:
  grafana_admin_password:
    file: /srv/kyrion/secrets/grafana_admin_password

volumes:
  loki-data:
  alloy-state:
  grafana-data:

networks:
  logs:
    internal: true
  akses: {}
